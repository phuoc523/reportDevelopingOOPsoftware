global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: scentstation-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: api-gateway
      - targets: ["identity-service:8081"]
        labels:
          service: identity-service
      - targets: ["catalog-service:8082"]
        labels:
          service: catalog-service
      - targets: ["order-service:8083"]
        labels:
          service: order-service
      - targets: ["machine-service:8084"]
        labels:
          service: machine-service
      - targets: ["operation-service:8085"]
        labels:
          service: operation-service
      - targets: ["reporting-service:8086"]
        labels:
          service: reporting-service
      - targets: ["notification-service:8087"]
        labels:
          service: notification-service
