global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: scentstation-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:9090"]
        labels:
          service: api-gateway
      - targets: ["identity-service:9090"]
        labels:
          service: identity-service
      - targets: ["catalog-service:9090"]
        labels:
          service: catalog-service
      - targets: ["order-service:9090"]
        labels:
          service: order-service
      - targets: ["machine-service:9090"]
        labels:
          service: machine-service
      - targets: ["operation-service:9090"]
        labels:
          service: operation-service
      - targets: ["reporting-service:9090"]
        labels:
          service: reporting-service
