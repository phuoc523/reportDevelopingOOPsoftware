name: SePay payment verification

on:
  push:
    branches:
      - feature/phung-sepay-mb-real-payment
  pull_request:
    branches:
      - main
    paths:
      - "services/order-service/**"
      - "frontend/admin-web/**"
      - "frontend/kiosk-web/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/sepay-live-payment-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order-service:
    name: Order Service clean verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/order-service/pom.xml
      - name: Maven clean verify
        run: mvn -B -ntp -f services/order-service/pom.xml clean verify
        env:
          MAVEN_OPTS: -Xms64m -Xmx1024m -XX:ActiveProcessorCount=2

  frontend:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [admin-web, kiosk-web]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build

  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate full-project Compose configuration
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

  secret-scan:
    name: Scan tracked source for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks against checked-out source
        shell: bash
        run: |
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source=/repo --no-git --redact=100 --exit-code=1 --report-format=json --report-path=/repo/gitleaks-report.json
          scan_status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("gitleaks-report.json")
          if report.exists():
              for finding in json.loads(report.read_text()):
                  print(f"{finding.get('File')}:{finding.get('StartLine')} rule={finding.get('RuleID')}")
              report.unlink()
          PY
          exit "$scan_status"
