name: ScentStation integration CI

on:
  push:
    branches: [test-2026-11-07-latest]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Test ${{ matrix.service }} (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api-gateway, java: '21' }
          - { service: identity-service, java: '21' }
          - { service: catalog-service, java: '21' }
          - { service: order-service, java: '21' }
          - { service: machine-service, java: '21' }
          - { service: operation-service, java: '21' }
          - { service: reporting-service, java: '21' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Maven tests
        run: mvn -B -ntp -f services/${{ matrix.service }}/pom.xml test
        env:
          MAVEN_OPTS: -Xms64m -Xmx1024m -XX:ActiveProcessorCount=2
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [admin-web, kiosk-web]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
