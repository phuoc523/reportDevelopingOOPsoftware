# Local backend stack. Each business service owns its database.
name: scentstation-local
services:
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
    command:
      - sh
      - -c
      - 'if [ -n "$${REDIS_PASSWORD}" ]; then exec redis-server --port "$${REDIS_PORT}" --appendonly yes --requirepass "$${REDIS_PASSWORD}"; else exec redis-server --port "$${REDIS_PORT}" --appendonly yes; fi'
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$${REDIS_PASSWORD}" ]; then redis-cli -p "$${REDIS_PORT}" -a "$${REDIS_PASSWORD}" ping | grep -q PONG; else redis-cli -p "$${REDIS_PORT}" ping | grep -q PONG; fi'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - redis-internal

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE: api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_CONNECT_TIMEOUT: "${REDIS_CONNECT_TIMEOUT:-2s}"
      REDIS_TIMEOUT: "${REDIS_TIMEOUT:-2s}"
      REDIS_CACHE_TTL: "${REDIS_CACHE_TTL:-60s}"
      IDENTITY_SERVICE_URL: http://identity-service:8081
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}"
      GATEWAY_RATE_LIMIT_ENABLED: "${GATEWAY_RATE_LIMIT_ENABLED:-true}"
      GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE: "${GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE:-120}"
      GATEWAY_RATE_LIMIT_WINDOW: "${GATEWAY_RATE_LIMIT_WINDOW:-1m}"
      CATALOG_SERVICE_URL: http://catalog-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      MACHINE_SERVICE_URL: http://machine-service:8084
      OPERATION_SERVICE_URL: http://operation-service:8085
      REPORTING_SERVICE_URL: http://reporting-service:8086
      CORS_ALLOWED_ORIGIN_1: http://localhost:7514
      CORS_ALLOWED_ORIGIN_2: http://127.0.0.1:7514
      CORS_ALLOWED_ORIGIN_3: http://localhost:7515
      CORS_ALLOWED_ORIGIN_4: http://127.0.0.1:7515
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      machine-service:
        condition: service_healthy
      operation-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - redis-internal

  identity-service:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE: identity-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_CONNECT_TIMEOUT: "${REDIS_CONNECT_TIMEOUT:-2s}"
      REDIS_TIMEOUT: "${REDIS_TIMEOUT:-2s}"
      REDIS_CACHE_TTL: "${REDIS_CACHE_TTL:-60s}"
      IDENTITY_CACHE_TTL: "${IDENTITY_CACHE_TTL:-60s}"
      IDENTITY_CACHE_ENABLED: "true"
      DB_URL: "jdbc:mysql://identity-db:3306/scentstation_identity?allowPublicKeyRetrieval=true&sslMode=DISABLED"
      DB_USERNAME: "identity_app"
      DB_PASSWORD: "identity_local_password"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}"
    depends_on:
      redis:
        condition: service_healthy
      identity-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/api/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - redis-internal

  catalog-service:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_CONNECT_TIMEOUT: "${REDIS_CONNECT_TIMEOUT:-2s}"
      REDIS_TIMEOUT: "${REDIS_TIMEOUT:-2s}"
      REDIS_CACHE_TTL: "${REDIS_CACHE_TTL:-60s}"
      CATALOG_PRODUCT_LIST_TTL: "${CATALOG_PRODUCT_LIST_TTL:-60s}"
      CATALOG_CACHE_ENABLED: "true"
      CATALOG_DB_URL: "jdbc:mysql://catalog-db:3306/scentstation_catalog?allowPublicKeyRetrieval=true&sslMode=DISABLED"
      CATALOG_DB_USERNAME: "catalog_app"
      CATALOG_DB_PASSWORD: "catalog_local_password"
      SPRING_PROFILES_ACTIVE: "local"
      IDENTITY_SERVICE_URL: "http://identity-service:8081"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}"
    depends_on:
      redis:
        condition: service_healthy
      catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - redis-internal

  order-service:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE: order-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_CONNECT_TIMEOUT: "${REDIS_CONNECT_TIMEOUT:-2s}"
      REDIS_TIMEOUT: "${REDIS_TIMEOUT:-2s}"
      REDIS_CACHE_TTL: "${REDIS_CACHE_TTL:-60s}"
      ORDER_STATUS_METADATA_TTL: "${ORDER_STATUS_METADATA_TTL:-5m}"
      ORDER_CACHE_ENABLED: "true"
      DB_URL: "jdbc:mysql://order-db:3306/order_db?allowPublicKeyRetrieval=true&sslMode=DISABLED"
      DB_USERNAME: "order_user"
      DB_PASSWORD: "order_local_password"
      MACHINE_SERVICE_BASE_URL: "http://machine-service:8084"
      CATALOG_SERVICE_BASE_URL: "http://catalog-service:8082"
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh"
      REPORTING_SERVICE_URL: "http://reporting-service:8086"
      REPORTING_SYNC_ENABLED: "true"
      REPORTING_SYNC_API_KEY: "${REPORTING_SYNC_API_KEY:?Set REPORTING_SYNC_API_KEY in .env}"
      IDENTITY_SERVICE_URL: "http://identity-service:8081"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}"
    depends_on:
      redis:
        condition: service_healthy
      order-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - redis-internal

  machine-service:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE: machine-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_CONNECT_TIMEOUT: "${REDIS_CONNECT_TIMEOUT:-2s}"
      REDIS_TIMEOUT: "${REDIS_TIMEOUT:-2s}"
      REDIS_CACHE_TTL: "${REDIS_CACHE_TTL:-60s}"
      MACHINE_LOCATION_LIST_TTL: "${MACHINE_LOCATION_LIST_TTL:-60s}"
      MACHINE_CACHE_ENABLED: "true"
      MACHINE_DB_URL: "jdbc:mysql://machine-db:3306/scentstation_machine?allowPublicKeyRetrieval=true&sslMode=DISABLED"
      MACHINE_DB_USERNAME: "machine_app"
      MACHINE_DB_PASSWORD: "machine_local_password"
      IDENTITY_SERVICE_URL: "http://identity-service:8081"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      MACHINE_NOTIFICATION_KAFKA_ENABLED: "true"
      MACHINE_NOTIFICATION_KAFKA_TOPIC: "machine-alert.v1"
    depends_on:
      redis:
        condition: service_healthy
      machine-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - redis-internal

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE: notification-service
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_CONNECT_TIMEOUT: "${REDIS_CONNECT_TIMEOUT:-2s}"
      REDIS_TIMEOUT: "${REDIS_TIMEOUT:-2s}"
      REDIS_CACHE_TTL: "${REDIS_CACHE_TTL:-60s}"
      NOTIFICATION_RATE_LIMIT_ENABLED: "${NOTIFICATION_RATE_LIMIT_ENABLED:-true}"
      NOTIFICATION_RATE_LIMIT_REQUESTS: "${NOTIFICATION_RATE_LIMIT_REQUESTS:-120}"
      NOTIFICATION_RATE_LIMIT_WINDOW: "${NOTIFICATION_RATE_LIMIT_WINDOW:-1m}"
      NOTIFICATION_DB_URL: "jdbc:mysql://notification-db:3306/scentstation_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      NOTIFICATION_DB_USERNAME: "notification_app"
      NOTIFICATION_DB_PASSWORD: "notification_local_password"
      NOTIFICATION_IDENTITY_URL: "http://identity-service:8081"
      NOTIFICATION_IDENTITY_INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      NOTIFICATION_KAFKA_ENABLED: "true"
      NOTIFICATION_KAFKA_MACHINE_ALERT_TOPIC: "machine-alert.v1"
      NOTIFICATION_KAFKA_GROUP_ID: "${NOTIFICATION_KAFKA_GROUP_ID:-notification-service-v1}"
      NOTIFICATION_KAFKA_RETRY_ATTEMPTS: "${NOTIFICATION_KAFKA_RETRY_ATTEMPTS:-3}"
      NOTIFICATION_KAFKA_RETRY_BACKOFF_MS: "${NOTIFICATION_KAFKA_RETRY_BACKOFF_MS:-1000}"
      NOTIFICATION_KAFKA_DEAD_LETTER_TOPIC: "machine-alert.v1.DLT"
      # Base compose stays operational without Firebase credentials. The Firebase overlay
      # explicitly enables FCM and requires a mounted service-account file.
      NOTIFICATION_FIREBASE_ENABLED: "false"
      NOTIFICATION_FIREBASE_PROJECT_ID: "${NOTIFICATION_FIREBASE_PROJECT_ID:-}"
      NOTIFICATION_FIREBASE_CREDENTIALS_PATH: "${NOTIFICATION_FIREBASE_CREDENTIALS_PATH:-}"
      NOTIFICATION_FIREBASE_POLL_INTERVAL: "${NOTIFICATION_FIREBASE_POLL_INTERVAL:-5s}"
      NOTIFICATION_FIREBASE_BATCH_SIZE: "${NOTIFICATION_FIREBASE_BATCH_SIZE:-20}"
      NOTIFICATION_FIREBASE_MAX_ATTEMPTS: "${NOTIFICATION_FIREBASE_MAX_ATTEMPTS:-5}"
      NOTIFICATION_FIREBASE_INITIAL_BACKOFF: "${NOTIFICATION_FIREBASE_INITIAL_BACKOFF:-10s}"
      NOTIFICATION_FIREBASE_DELIVERY_LEASE: "${NOTIFICATION_FIREBASE_DELIVERY_LEASE:-5m}"
    depends_on:
      redis:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - default
      - redis-internal

  operation-service:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE: operation-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_CONNECT_TIMEOUT: "${REDIS_CONNECT_TIMEOUT:-2s}"
      REDIS_TIMEOUT: "${REDIS_TIMEOUT:-2s}"
      REDIS_CACHE_TTL: "${REDIS_CACHE_TTL:-60s}"
      OPERATION_CHECKLIST_TTL: "${OPERATION_CHECKLIST_TTL:-5s}"
      OPERATION_CACHE_ENABLED: "true"
      OPERATION_DB_URL: "jdbc:mysql://operation-db:3306/scentstation_operation?allowPublicKeyRetrieval=true&sslMode=DISABLED"
      OPERATION_DB_USERNAME: "operation_app"
      OPERATION_DB_PASSWORD: "operation_local_password"
      IDENTITY_SERVICE_URL: "http://identity-service:8081"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}"
      SPRING_PROFILES_ACTIVE: "docker-local"
    depends_on:
      redis:
        condition: service_healthy
      operation-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - redis-internal

  reporting-service:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE: reporting-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_CONNECT_TIMEOUT: "${REDIS_CONNECT_TIMEOUT:-2s}"
      REDIS_TIMEOUT: "${REDIS_TIMEOUT:-2s}"
      REDIS_CACHE_TTL: "${REDIS_CACHE_TTL:-60s}"
      REPORTING_DASHBOARD_RATE_LIMIT_ENABLED: "${REPORTING_DASHBOARD_RATE_LIMIT_ENABLED:-true}"
      REPORTING_DASHBOARD_RATE_LIMIT_REQUESTS: "${REPORTING_DASHBOARD_RATE_LIMIT_REQUESTS:-120}"
      REPORTING_DASHBOARD_RATE_LIMIT_WINDOW: "${REPORTING_DASHBOARD_RATE_LIMIT_WINDOW:-1m}"
      DB_URL: "jdbc:mysql://reporting-db:3306/scentstation_reporting?allowPublicKeyRetrieval=true&sslMode=DISABLED"
      DB_USERNAME: "reporting_app"
      DB_PASSWORD: "reporting_local_password"
      ORDER_SERVICE_URL: "http://order-service:8083"
      MACHINE_SERVICE_URL: "http://machine-service:8084"
      OPERATION_SERVICE_URL: "http://operation-service:8085"
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh"
      REPORTING_SYNC_API_KEY: "${REPORTING_SYNC_API_KEY:?Set REPORTING_SYNC_API_KEY in .env}"
      IDENTITY_SERVICE_URL: "http://identity-service:8081"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}"
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      redis:
        condition: service_healthy
      reporting-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8086/api/reporting/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - redis-internal

  identity-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_identity
      MYSQL_USER: identity_app
      MYSQL_PASSWORD: identity_local_password
      MYSQL_ROOT_PASSWORD: identity_local_root_password
    volumes:
      - identity-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  catalog-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_catalog
      MYSQL_USER: catalog_app
      MYSQL_PASSWORD: catalog_local_password
      MYSQL_ROOT_PASSWORD: catalog_local_root_password
    volumes:
      - catalog-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  order-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_local_password
      MYSQL_ROOT_PASSWORD: order_local_root_password
    volumes:
      - order-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  machine-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_machine
      MYSQL_USER: machine_app
      MYSQL_PASSWORD: machine_local_password
      MYSQL_ROOT_PASSWORD: machine_local_root_password
    volumes:
      - machine-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  operation-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_operation
      MYSQL_USER: operation_app
      MYSQL_PASSWORD: operation_local_password
      MYSQL_ROOT_PASSWORD: operation_local_root_password
    volumes:
      - operation-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  reporting-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_reporting
      MYSQL_USER: reporting_app
      MYSQL_PASSWORD: reporting_local_password
      MYSQL_ROOT_PASSWORD: reporting_local_root_password
    volumes:
      - reporting-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  notification-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_notification
      MYSQL_USER: notification_app
      MYSQL_PASSWORD: notification_local_password
      MYSQL_ROOT_PASSWORD: notification_local_root_password
    volumes:
      - notification-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic machine-alert.v1
        --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic machine-alert.v1.DLT
        --partitions 1 --replication-factor 1

volumes:
  identity-data:
  catalog-data:
  order-data:
  machine-data:
  operation-data:
  reporting-data:
  notification-data:
  kafka-data:

networks:
  default:
    name: scentstation-backend
  redis-internal:
    name: scentstation-redis
    internal: true
