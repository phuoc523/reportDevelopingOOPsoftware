      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - redis-internal

  identity-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_identity
      MYSQL_USER: identity_app
      MYSQL_PASSWORD: identity_local_password
      MYSQL_ROOT_PASSWORD: identity_local_root_password
    volumes:
      - identity-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  catalog-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_catalog
      MYSQL_USER: catalog_app
      MYSQL_PASSWORD: catalog_local_password
      MYSQL_ROOT_PASSWORD: catalog_local_root_password
    volumes:
      - catalog-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  order-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_local_password
      MYSQL_ROOT_PASSWORD: order_local_root_password
    volumes:
      - order-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  machine-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_machine
      MYSQL_USER: machine_app
      MYSQL_PASSWORD: machine_local_password
      MYSQL_ROOT_PASSWORD: machine_local_root_password
    volumes:
      - machine-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  operation-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_operation
      MYSQL_USER: operation_app
      MYSQL_PASSWORD: operation_local_password
      MYSQL_ROOT_PASSWORD: operation_local_root_password
    volumes:
      - operation-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  reporting-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_reporting
      MYSQL_USER: reporting_app
      MYSQL_PASSWORD: reporting_local_password
      MYSQL_ROOT_PASSWORD: reporting_local_root_password
    volumes:
      - reporting-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  notification-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scentstation_notification
      MYSQL_USER: notification_app
      MYSQL_PASSWORD: notification_local_password
      MYSQL_ROOT_PASSWORD: notification_local_root_password
    volumes:
      - notification-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic machine-alert.v1
        --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic machine-alert.v1.DLT
        --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic payment-events.v1
        --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic payment-events.v1.DLT
        --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic dispense-events.v1
        --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic dispense-events.v1.DLT
        --partitions 3 --replication-factor 1

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      alertmanager:
        condition: service_started
    restart: unless-stopped

  alertmanager-secret-init:
    image: busybox:1.37.0
    profiles: ["monitoring"]
    environment:
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        umask 077;
        printf '%s' "$$INTERNAL_SERVICE_KEY" > /run/scentstation-secrets/internal-service-key;
        chown 65534:65534 /run/scentstation-secrets/internal-service-key;
        chmod 0400 /run/scentstation-secrets/internal-service-key
    volumes:
      - alertmanager-secrets:/run/scentstation-secrets
    restart: "no"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-secrets:/run/scentstation-secrets:ro
      - alertmanager-data:/alertmanager
    depends_on:
      alertmanager-secret-init:
        condition: service_completed_successfully
      notification-service:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["monitoring"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test -n "$$GF_SECURITY_ADMIN_PASSWORD" ||
        { echo 'GRAFANA_ADMIN_PASSWORD must be set before enabling the monitoring profile' >&2; exit 1; };
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  identity-data:
  catalog-data:
  order-data:
  machine-data:
  operation-data:
  reporting-data:
  notification-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  alertmanager-secrets:

networks:
  default:
    name: scentstation-backend
  redis-internal:
    name: scentstation-redis
    internal: true
