spring.datasource.url=${MACHINE_DB_URL:jdbc:mysql://127.0.0.1:3306/scentstation_machine?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MACHINE_DB_USERNAME:root}
spring.datasource.password=${MACHINE_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.application.name=machine-service
server.port=${MACHINE_SERVICE_PORT:8084}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.serialization.write-dates-as-timestamps=false
machine.commands.expiry-interval-ms=${MACHINE_COMMAND_EXPIRY_INTERVAL_MS:60000}
machine.commands.lifetime-ms=${MACHINE_COMMAND_LIFETIME_MS:60000}
machine.alerts.escalate-after-ms=${MACHINE_ALERT_ESCALATE_AFTER_MS:300000}
machine.alerts.escalation-interval-ms=${MACHINE_ALERT_ESCALATION_INTERVAL_MS:60000}
machine.integration.operation-service-url=${MACHINE_OPERATION_SERVICE_URL:}
machine.integration.notification-service-url=${MACHINE_NOTIFICATION_SERVICE_URL:}
machine.integration.maintenance-service-url=${MACHINE_MAINTENANCE_SERVICE_URL:}
machine.integration.shared-secret=${MACHINE_INTEGRATION_SHARED_SECRET:}
machine.integration.handoff-retry-interval-ms=${MACHINE_HANDOFF_RETRY_INTERVAL_MS:60000}
machine.gateway.enforce-tenant-header=${MACHINE_GATEWAY_ENFORCE_TENANT_HEADER:false}
machine.mqtt.enabled=${MACHINE_MQTT_ENABLED:false}
machine.mqtt.broker-url=${MACHINE_MQTT_BROKER_URL:tcp://localhost:1883}
machine.mqtt.username=${MACHINE_MQTT_USERNAME:}
machine.mqtt.password=${MACHINE_MQTT_PASSWORD:}
machine.mqtt.client-id=${MACHINE_MQTT_CLIENT_ID:machine-service}
machine.mqtt.connection-timeout-seconds=${MACHINE_MQTT_CONNECTION_TIMEOUT_SECONDS:10}
machine.mqtt.keep-alive-interval-seconds=${MACHINE_MQTT_KEEP_ALIVE_INTERVAL_SECONDS:30}
machine.mqtt.reconnect-interval-ms=${MACHINE_MQTT_RECONNECT_INTERVAL_MS:5000}
machine.mqtt.max-payload-bytes=${MACHINE_MQTT_MAX_PAYLOAD_BYTES:65536}
machine.mqtt.allowed-clock-skew-seconds=${MACHINE_MQTT_ALLOWED_CLOCK_SKEW_SECONDS:300}
integration.identity.base-url=${IDENTITY_SERVICE_URL:http://localhost:8081}
security.internal.service-key=${INTERNAL_SERVICE_KEY:}
