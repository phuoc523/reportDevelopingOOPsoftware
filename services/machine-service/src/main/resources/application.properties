spring.datasource.url=${MACHINE_DB_URL:jdbc:mysql://127.0.0.1:3306/scentstation_machine?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MACHINE_DB_USERNAME:root}
spring.datasource.password=${MACHINE_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.application.name=machine-service
server.port=${MACHINE_SERVICE_PORT:8084}
machine.commands.expiry-interval-ms=${MACHINE_COMMAND_EXPIRY_INTERVAL_MS:60000}
machine.commands.lifetime-ms=${MACHINE_COMMAND_LIFETIME_MS:60000}
machine.alerts.escalate-after-ms=${MACHINE_ALERT_ESCALATE_AFTER_MS:300000}
machine.alerts.escalation-interval-ms=${MACHINE_ALERT_ESCALATION_INTERVAL_MS:60000}
machine.integration.operation-service-url=${MACHINE_OPERATION_SERVICE_URL:}
machine.integration.notification-service-url=${MACHINE_NOTIFICATION_SERVICE_URL:}
machine.integration.maintenance-service-url=${MACHINE_MAINTENANCE_SERVICE_URL:}
machine.integration.shared-secret=${MACHINE_INTEGRATION_SHARED_SECRET:}
machine.gateway.enforce-tenant-header=${MACHINE_GATEWAY_ENFORCE_TENANT_HEADER:false}


# Local development convenience. The standalone SQL file is the canonical schema reference.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
