spring.datasource.url=${MACHINE_DB_URL:jdbc:mysql://127.0.0.1:3306/scentstation_machine?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MACHINE_DB_USERNAME:root}
spring.datasource.password=${MACHINE_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.application.name=machine-service
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.cache.type=redis
spring.cache.redis.time-to-live=${REDIS_CACHE_TTL:60s}
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=scentstation:machine:spring-cache:v1:
server.port=${MACHINE_SERVICE_PORT:8084}
machine.commands.expiry-interval-ms=${MACHINE_COMMAND_EXPIRY_INTERVAL_MS:60000}
machine.commands.lifetime-ms=${MACHINE_COMMAND_LIFETIME_MS:60000}
machine.commands.simulation.enabled=${MACHINE_COMMAND_SIMULATION_ENABLED:false}
machine.alerts.escalate-after-ms=${MACHINE_ALERT_ESCALATE_AFTER_MS:300000}
machine.alerts.escalation-interval-ms=${MACHINE_ALERT_ESCALATION_INTERVAL_MS:60000}
machine.integration.operation-service-url=${MACHINE_OPERATION_SERVICE_URL:}
# Full intake URL, for example: http://notification-service:8087/internal/events/machine-alerts
machine.integration.notification-service-url=${MACHINE_NOTIFICATION_SERVICE_URL:}
machine.integration.maintenance-service-url=${MACHINE_MAINTENANCE_SERVICE_URL:}
machine.integration.shared-secret=${INTERNAL_SERVICE_KEY:}
machine.gateway.enforce-tenant-header=${MACHINE_GATEWAY_ENFORCE_TENANT_HEADER:false}
machine.mqtt.enabled=${MACHINE_MQTT_ENABLED:false}
machine.mqtt.broker-url=${MACHINE_MQTT_BROKER_URL:tcp://localhost:1883}
machine.mqtt.username=${MACHINE_MQTT_USERNAME:}
machine.mqtt.password=${MACHINE_MQTT_PASSWORD:}
machine.mqtt.client-id=${MACHINE_MQTT_CLIENT_ID:machine-service}
machine.mqtt.connection-timeout-seconds=${MACHINE_MQTT_CONNECTION_TIMEOUT_SECONDS:10}
machine.mqtt.keep-alive-interval-seconds=${MACHINE_MQTT_KEEP_ALIVE_INTERVAL_SECONDS:30}
machine.mqtt.reconnect-interval-ms=${MACHINE_MQTT_RECONNECT_INTERVAL_MS:5000}
machine.mqtt.command-retry-interval-ms=${MACHINE_MQTT_COMMAND_RETRY_INTERVAL_MS:3000}
machine.mqtt.max-payload-bytes=${MACHINE_MQTT_MAX_PAYLOAD_BYTES:65536}
machine.mqtt.allowed-clock-skew-seconds=${MACHINE_MQTT_ALLOWED_CLOCK_SKEW_SECONDS:300}
machine.mqtt.heartbeat-timeout-ms=${MACHINE_MQTT_HEARTBEAT_TIMEOUT_MS:15000}
machine.mqtt.connectivity-check-interval-ms=${MACHINE_MQTT_CONNECTIVITY_CHECK_INTERVAL_MS:5000}
machine.notification.kafka.enabled=${MACHINE_NOTIFICATION_KAFKA_ENABLED:false}
machine.notification.kafka.topic=${MACHINE_NOTIFICATION_KAFKA_TOPIC:machine-alert.v1}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
integration.identity.base-url=${IDENTITY_SERVICE_URL:http://localhost:8081}
security.internal.service-key=${INTERNAL_SERVICE_KEY:}


# Local development convenience. The standalone SQL file is the canonical schema reference.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
machine.cache.enabled=${MACHINE_CACHE_ENABLED:true}
machine.cache.location-list-ttl=${MACHINE_LOCATION_LIST_TTL:60s}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
