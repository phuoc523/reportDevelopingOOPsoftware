spring.application.name=machine-service
server.port=${MACHINE_SERVICE_PORT:8084}
machine.operating-hours.zone=${MACHINE_OPERATING_HOURS_ZONE:Asia/Ho_Chi_Minh}
machine.iot.mqtt.enabled=${MACHINE_MQTT_ENABLED:false}
machine.iot.mqtt.broker-uri=${MACHINE_MQTT_BROKER_URI:}
machine.iot.mqtt.username=${MACHINE_MQTT_USERNAME:}
machine.iot.mqtt.password=${MACHINE_MQTT_PASSWORD:}
machine.iot.mqtt.client-id=${MACHINE_MQTT_CLIENT_ID:machine-service-ingestion}
machine.iot.command-expiry-interval-ms=${MACHINE_COMMAND_EXPIRY_INTERVAL_MS:60000}
machine.monitor.interval-ms=${MACHINE_MONITOR_INTERVAL_MS:15000}
machine.monitor.unstable-after-ms=${MACHINE_UNSTABLE_AFTER_MS:30000}
machine.monitor.offline-after-ms=${MACHINE_OFFLINE_AFTER_MS:90000}
machine.alerts.escalate-after-ms=${MACHINE_ALERT_ESCALATE_AFTER_MS:300000}
machine.alerts.low-stock-percent=${MACHINE_LOW_STOCK_PERCENT:15}
machine.integration.shared-secret=${MACHINE_INTEGRATION_SHARED_SECRET:}
machine.history.retention-days=${MACHINE_HISTORY_RETENTION_DAYS:90}
machine.history.retention-cron=${MACHINE_HISTORY_RETENTION_CRON:0 20 3 * * *}

spring.datasource.url=${MACHINE_DB_URL:jdbc:mysql://127.0.0.1:3306/scentstation_machine?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MACHINE_DB_USERNAME:root}
spring.datasource.password=${MACHINE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Local development convenience. The standalone SQL file is the canonical schema reference.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
