spring:
  application:
    name: machine-service
  datasource:
    url: ${MACHINE_DB_URL:jdbc:mysql://127.0.0.1:3306/scentstation_machine?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MACHINE_DB_USERNAME:root}
    password: ${MACHINE_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${MACHINE_SERVICE_PORT:8084}

machine:
  commands:
    expiry-interval-ms: ${MACHINE_COMMAND_EXPIRY_INTERVAL_MS:60000}
    lifetime-ms: ${MACHINE_COMMAND_LIFETIME_MS:60000}
  alerts:
    escalate-after-ms: ${MACHINE_ALERT_ESCALATE_AFTER_MS:300000}
    escalation-interval-ms: ${MACHINE_ALERT_ESCALATION_INTERVAL_MS:60000}
  integration:
    operation-service-url: ${MACHINE_OPERATION_SERVICE_URL:}
    notification-service-url: ${MACHINE_NOTIFICATION_SERVICE_URL:}
    maintenance-service-url: ${MACHINE_MAINTENANCE_SERVICE_URL:}
    shared-secret: ${MACHINE_INTEGRATION_SHARED_SECRET:}
    handoff-retry-interval-ms: ${MACHINE_HANDOFF_RETRY_INTERVAL_MS:60000}
  gateway:
    enforce-tenant-header: ${MACHINE_GATEWAY_ENFORCE_TENANT_HEADER:false}
