spring.application.name=machine-service
server.port=${MACHINE_SERVICE_PORT:8084}

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/scentstation_machine?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Local development convenience. The standalone SQL file is the canonical schema reference.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
