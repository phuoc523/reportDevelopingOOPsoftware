services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    profiles: ["mqtt"]
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/acl:/mosquitto/config/acl:ro
      - ./mqtt/secrets/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

volumes:
  mosquitto-data:
