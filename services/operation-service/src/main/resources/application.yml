spring:
  application:
    name: operation-service
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_CACHE_TTL:60s}
      cache-null-values: false
      key-prefix: "scentstation:operation:spring-cache:v1:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  datasource:
    url: ${OPERATION_DB_URL:jdbc:mysql://localhost:3306/scentstation_operation}
    username: ${OPERATION_DB_USERNAME:}
    password: ${OPERATION_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${OPERATION_SERVICE_PORT:8085}

integration:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

security:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

operation:
  cache:
    enabled: ${OPERATION_CACHE_ENABLED:true}
    checklist-ttl: ${OPERATION_CHECKLIST_TTL:5s}
