spring:
  application:
    name: operation-service
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_CACHE_TTL:60s}
      cache-null-values: false
      key-prefix: "scentstation:operation:spring-cache:v1:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${OPERATION_KAFKA_DISPENSE_GROUP:operation-dispense-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.scentstation.operation.event"
        spring.json.value.default.type: com.scentstation.operation.event.DispenseCompletedEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: ${OPERATION_DB_URL:jdbc:mysql://localhost:3306/scentstation_operation}
    username: ${OPERATION_DB_USERNAME:}
    password: ${OPERATION_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${OPERATION_SERVICE_PORT:8085}

integration:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

security:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

operation:
  cache:
    enabled: ${OPERATION_CACHE_ENABLED:true}
    checklist-ttl: ${OPERATION_CHECKLIST_TTL:5s}
  events:
    kafka:
      enabled: ${OPERATION_KAFKA_ENABLED:false}
      dispense-topic: ${OPERATION_KAFKA_DISPENSE_TOPIC:dispense-events.v1}
      group-id: ${OPERATION_KAFKA_DISPENSE_GROUP:operation-dispense-v1}
      dead-letter-topic: ${OPERATION_KAFKA_DISPENSE_DLT:dispense-events.v1.DLT}
      retry-attempts: ${OPERATION_KAFKA_RETRY_ATTEMPTS:5}
      retry-backoff-ms: ${OPERATION_KAFKA_RETRY_BACKOFF_MS:2000}
