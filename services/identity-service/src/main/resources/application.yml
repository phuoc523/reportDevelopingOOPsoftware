server:
  port: ${IDENTITY_PORT:8081}
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scentstation_identity?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Development bootstrap only. Replace with versioned migrations before production.
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
auth:
  session-ttl-minutes: ${AUTH_SESSION_TTL_MINUTES:30}
  max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
  lock-minutes: ${AUTH_LOCK_MINUTES:15}
  # Optional OOP-16 JWT compatibility. Opaque tokens remain default.
  jwt:
    enabled: ${JWT_ENABLED:false}
    secret-base64: ${JWT_SECRET_BASE64:}
