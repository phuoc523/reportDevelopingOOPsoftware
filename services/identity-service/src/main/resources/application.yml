server:
  port: 8081
spring:
  application:
    name: identity-service
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_CACHE_TTL:60s}
      cache-null-values: false
      key-prefix: ${REDIS_CACHE_PREFIX:identity-service:}
      use-key-prefix: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/scentstation_identity?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
security:
  jwt:
    # Replace this development key with a strong secret from an environment variable in real deployments.
    secret: ${JWT_SECRET:U2NlbnRTdGF0aW9uRGV2ZWxvcG1lbnRLZXlGb3JKV1QyMDI2IQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  internal:
    # Mandatory for private service-to-service introspection. No default credential.
    service-key: ${INTERNAL_SERVICE_KEY:}
