spring:
  application:
    name: catalog-service

  datasource:
    url: ${CATALOG_DB_URL:jdbc:mysql://localhost:3306/scentstation_catalog}
    username: ${CATALOG_DB_USERNAME:}
    password: ${CATALOG_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${CATALOG_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
