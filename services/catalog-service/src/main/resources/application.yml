
spring:
  application:
    name: catalog-service

  datasource:
    url: ${CATALOG_DB_URL:jdbc:mysql://localhost:3306/scentstation_catalog}
    username: ${CATALOG_DB_USERNAME:}
    password: ${CATALOG_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

server:
  port: ${CATALOG_SERVICE_PORT:8082}

integration:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

security:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
