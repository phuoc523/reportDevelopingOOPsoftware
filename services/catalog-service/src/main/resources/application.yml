
spring:
  application:
    name: catalog-service
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_CACHE_TTL:60s}
      cache-null-values: false
      key-prefix: "scentstation:catalog:spring-cache:v1:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  datasource:
    url: ${CATALOG_DB_URL:jdbc:mysql://localhost:3306/scentstation_catalog}
    username: ${CATALOG_DB_USERNAME:}
    password: ${CATALOG_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

server:
  port: ${CATALOG_SERVICE_PORT:8082}

integration:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

security:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

catalog:
  cache:
    enabled: ${CATALOG_CACHE_ENABLED:true}
    product-list-ttl: ${CATALOG_PRODUCT_LIST_TTL:60s}
