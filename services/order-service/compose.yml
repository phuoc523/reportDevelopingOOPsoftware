services:
  order-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-order_db}
      MYSQL_USER: ${DB_USERNAME:-order_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-order_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - order-db-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ORDER_SERVICE_PORT: 8083
      DB_HOST: order-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-order_db}
      DB_USERNAME: ${DB_USERNAME:-order_user}
      DB_PASSWORD: ${DB_PASSWORD:-order_password}
      ORDER_EXPIRATION: ${ORDER_EXPIRATION:-PT15M}
      PAYMENT_QR_EXPIRATION: ${PAYMENT_QR_EXPIRATION:-PT15M}
      PAYMENT_CALLBACK_TOKEN: ${PAYMENT_CALLBACK_TOKEN:-local-mock-callback-token}
      MACHINE_SERVICE_BASE_URL: ${MACHINE_SERVICE_BASE_URL:-http://host.docker.internal:8084}
      REDIS_HOST: ${REDIS_CONTAINER_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-2s}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2s}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-60s}
      ORDER_STATUS_METADATA_TTL: ${ORDER_STATUS_METADATA_TTL:-5m}
      ORDER_CACHE_ENABLED: ${ORDER_CACHE_ENABLED:-true}
    ports:
      - "${ORDER_SERVICE_PORT:-8083}:8083"
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - default
      - scentstation-backend
      - scentstation-redis

volumes:
  order-db-data:

networks:
  scentstation-backend:
    external: true
    name: scentstation-backend
  scentstation-redis:
    external: true
    name: scentstation-redis
