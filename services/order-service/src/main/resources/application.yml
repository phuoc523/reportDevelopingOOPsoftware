spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:order_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD:order_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:database/schema.sql

server:
  port: ${ORDER_SERVICE_PORT:8083}

payment:
  qr-expiration: ${PAYMENT_QR_EXPIRATION:PT15M}
  callback-token: ${PAYMENT_CALLBACK_TOKEN:local-mock-callback-token}

order:
  expiration: ${ORDER_EXPIRATION:PT15M}

machine-service:
  base-url: ${MACHINE_SERVICE_BASE_URL:http://localhost:8084}
