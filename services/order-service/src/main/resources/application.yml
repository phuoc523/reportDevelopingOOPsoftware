spring:
  application:
    name: order-service
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_CACHE_TTL:60s}
      cache-null-values: false
      key-prefix: "scentstation:order:spring-cache:v1:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:order_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD:order_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:database/schema.sql,classpath:database/sepay-credit-events.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true

server:
  port: ${ORDER_SERVICE_PORT:8083}

payment:
  provider: ${PAYMENT_PROVIDER:MOCK}
  sepay:
    account: ${PAYMENT_BANK_ACCOUNT:}
    holder: ${PAYMENT_BANK_ACCOUNT_NAME:}
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
  qr-expiration: ${PAYMENT_QR_EXPIRATION:PT15M}
  callback-token: ${PAYMENT_CALLBACK_TOKEN:local-mock-callback-token}
  mock-web-base-url: ${PAYMENT_MOCK_WEB_BASE_URL:http://localhost:3000/mock-payment}

order:
  expiration: ${ORDER_EXPIRATION:PT15M}
  cache:
    enabled: ${ORDER_CACHE_ENABLED:true}
    status-metadata-ttl: ${ORDER_STATUS_METADATA_TTL:5m}
  events:
    kafka:
      enabled: ${ORDER_KAFKA_ENABLED:false}
      payment-topic: ${ORDER_KAFKA_PAYMENT_TOPIC:payment-events.v1}
      dispense-topic: ${ORDER_KAFKA_DISPENSE_TOPIC:dispense-events.v1}
    outbox:
      poll-interval-ms: ${ORDER_OUTBOX_POLL_INTERVAL_MS:1000}
      initial-delay-ms: ${ORDER_OUTBOX_INITIAL_DELAY_MS:5000}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

integration:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

security:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:}

machine-service:
  base-url: ${MACHINE_SERVICE_BASE_URL:http://localhost:8084}

catalog-service:
  base-url: ${CATALOG_SERVICE_BASE_URL:http://localhost:8082}
