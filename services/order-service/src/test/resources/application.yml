spring:
  datasource:
    url: jdbc:h2:mem:order-service-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:database/schema.sql

reporting-service:
  enabled: false
  base-url: http://localhost:8086
  api-key: test-reporting-sync-key

integration:
  identity:
    base-url: http://127.0.0.1:1

security:
  internal:
    service-key: test-internal-service-key
