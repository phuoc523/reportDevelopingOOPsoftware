server:
  port: ${NOTIFICATION_SERVICE_PORT:8087}
  shutdown: graceful

spring:
  application:
    name: notification-service
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_CACHE_TTL:60s}
      cache-null-values: false
      key-prefix: ${REDIS_CACHE_PREFIX:notification-service:}
      use-key-prefix: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:mysql://127.0.0.1:3306/scentstation_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${NOTIFICATION_DB_USERNAME}
    password: ${NOTIFICATION_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: ${NOTIFICATION_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${NOTIFICATION_DB_VALIDATION_TIMEOUT_MS:3000}
      maximum-pool-size: ${NOTIFICATION_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${NOTIFICATION_DB_MIN_IDLE:2}
  lifecycle:
    timeout-per-shutdown-phase: ${NOTIFICATION_SHUTDOWN_TIMEOUT:20s}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.scentstation.notification.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.scentstation.notification.event.MachineAlertEvent
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

notification:
  firebase:
    enabled: ${NOTIFICATION_FIREBASE_ENABLED:false}
    credentials-path: ${NOTIFICATION_FIREBASE_CREDENTIALS_PATH:}
    project-id: ${NOTIFICATION_FIREBASE_PROJECT_ID:}
    delivery:
      poll-interval: ${NOTIFICATION_FIREBASE_POLL_INTERVAL:5s}
      batch-size: ${NOTIFICATION_FIREBASE_BATCH_SIZE:20}
      max-attempts: ${NOTIFICATION_FIREBASE_MAX_ATTEMPTS:5}
      initial-backoff: ${NOTIFICATION_FIREBASE_INITIAL_BACKOFF:10s}
      lease: ${NOTIFICATION_FIREBASE_DELIVERY_LEASE:5m}
  identity:
    url: ${NOTIFICATION_IDENTITY_URL:http://localhost:8081}
    internal-service-key: ${NOTIFICATION_IDENTITY_INTERNAL_SERVICE_KEY:}
    connect-timeout: ${NOTIFICATION_IDENTITY_CONNECT_TIMEOUT:2s}
    read-timeout: ${NOTIFICATION_IDENTITY_READ_TIMEOUT:5s}
  kafka:
    enabled: ${NOTIFICATION_KAFKA_ENABLED:false}
    machine-alert-topic: ${NOTIFICATION_KAFKA_MACHINE_ALERT_TOPIC:machine-alert.v1}
    group-id: ${NOTIFICATION_KAFKA_GROUP_ID:notification-service-v1}
    retry-attempts: ${NOTIFICATION_KAFKA_RETRY_ATTEMPTS:3}
    retry-backoff-ms: ${NOTIFICATION_KAFKA_RETRY_BACKOFF_MS:1000}
    dead-letter-topic: ${NOTIFICATION_KAFKA_DEAD_LETTER_TOPIC:machine-alert.v1.DLT}
