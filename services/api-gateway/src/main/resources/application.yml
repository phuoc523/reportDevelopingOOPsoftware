server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${CORS_ALLOWED_ORIGIN_1:http://localhost:3000}
              - ${CORS_ALLOWED_ORIGIN_2:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/admin/**,/api/staff/**,/api/customer/**,/api/platform/**,/api/brand/**,/api/audit/**

        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**,/api/campaigns/**,/api/catalog/**,/api/pricing/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/orders/**,/api/v1/payments/**

        - id: machine-service
          uri: ${MACHINE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/machines/**,/api/alerts/**,/api/locations/**,/api/dispense-commands/**

        - id: operation-service
          uri: ${OPERATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/inventory/**,/api/maintenance/**

        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/reporting/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.web.cors: TRACE
    org.springframework.cloud.gateway: INFO