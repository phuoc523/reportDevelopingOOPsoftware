server:
  port: 8080

spring:
  application:
    name: api-gateway
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_CACHE_TTL:60s}
      cache-null-values: false
      key-prefix: "scentstation:api-gateway:spring-cache:v1:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${CORS_ALLOWED_ORIGIN_1:http://localhost:3000}
              - ${CORS_ALLOWED_ORIGIN_2:http://localhost:5173}
              - ${CORS_ALLOWED_ORIGIN_3:http://localhost:7515}
              - ${CORS_ALLOWED_ORIGIN_4:http://127.0.0.1:7515}
              - ${CORS_ALLOWED_ORIGIN_5:http://localhost:3000}
              - ${CORS_ALLOWED_ORIGIN_6:http://127.0.0.1:7515}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Request-Id
            exposedHeaders:
              - X-Request-Id
            allowCredentials: true
      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/admin/**,/api/staff/**,/api/customer/**,/api/platform/**,/api/brand/**,/api/audit/**

        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**,/api/campaigns/**,/api/catalog/**,/api/pricing/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/orders/**,/api/v1/payments/**

        - id: machine-service
          uri: ${MACHINE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/machines/**,/api/alerts/**,/api/locations/**,/api/dispense-commands/**

        - id: operation-service
          uri: ${OPERATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/inventory/**,/api/maintenance/**

        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/reporting/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/notifications/**,/api/notification-device-tokens/**

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

gateway:
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE:120}
    window: ${GATEWAY_RATE_LIMIT_WINDOW:1m}
    identity-service-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    internal-service-key: ${INTERNAL_SERVICE_KEY:}

logging:
  level:
    org.springframework.web.cors: INFO
    org.springframework.cloud.gateway: INFO
