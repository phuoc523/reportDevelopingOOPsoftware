spring:
  application:
    name: reporting-service
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_CACHE_TTL:60s}
      cache-null-values: false
      key-prefix: "scentstation:reporting:spring-cache:v1:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/scentstation_reporting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:reporting_app}
    password: ${DB_PASSWORD:reporting_app}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.scentstation.reporting.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.scentstation.reporting.event.PaymentChangedEvent
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true

server:
  port: ${REPORTING_SERVICE_PORT:8086}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

reporting:
  zone-id: ${REPORTING_TIME_ZONE:Asia/Ho_Chi_Minh}
  sync:
    api-key: ${REPORTING_SYNC_API_KEY:local-reporting-sync-key}
  rate-limit:
    dashboard:
      enabled: ${REPORTING_DASHBOARD_RATE_LIMIT_ENABLED:true}
      max-requests: ${REPORTING_DASHBOARD_RATE_LIMIT_REQUESTS:120}
      window: ${REPORTING_DASHBOARD_RATE_LIMIT_WINDOW:1m}
  events:
    kafka:
      enabled: ${REPORTING_KAFKA_ENABLED:false}
      payment-topic: ${REPORTING_KAFKA_PAYMENT_TOPIC:payment-events.v1}
      group-id: ${REPORTING_KAFKA_GROUP_ID:reporting-payment-v1}
      retry-attempts: ${REPORTING_KAFKA_RETRY_ATTEMPTS:5}
      retry-backoff-ms: ${REPORTING_KAFKA_RETRY_BACKOFF_MS:2000}
      dead-letter-topic: ${REPORTING_KAFKA_DEAD_LETTER_TOPIC:payment-events.v1.DLT}

integration:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083}
  machine:
    base-url: ${MACHINE_SERVICE_URL:http://localhost:8084}
  operation:
    base-url: ${OPERATION_SERVICE_URL:http://localhost:8085}
    zone-id: ${OPERATION_SERVICE_ZONE_ID:UTC}

security:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:}
